<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Social Post Creator</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .reset-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }
    .reset-card h1 { color: var(--text); margin-bottom: .5rem; font-size: 1.5rem; }
    .reset-card p { color: var(--muted); font-size: .875rem; margin-bottom: 1.25rem; }
    .reset-card form { display: flex; flex-direction: column; gap: .75rem; }
    .reset-input {
      padding: .75rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    .reset-input:focus { border-color: var(--primary); }
    .reset-input::placeholder { color: var(--muted); }
    .reset-btn {
      padding: .75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: .25rem;
    }
    .reset-btn:hover { background: var(--primary-h); }
    .reset-btn:disabled { opacity: .5; cursor: not-allowed; }
    .reset-error {
      color: var(--red);
      font-size: .85rem;
      margin-top: .5rem;
      text-align: center;
    }
    .reset-success {
      color: var(--green, #22c55e);
      font-size: .9rem;
      margin-top: .5rem;
      text-align: center;
    }
    .hidden { display: none !important; }
    .back-link { text-align: center; margin-top: 1rem; }
    .back-link a { color: var(--primary); text-decoration: none; font-size: .875rem; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#6366f1"/>
          <path d="M8 14h12M14 8v12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>Social Post Creator</span>
      </div>
    </div>
  </header>

  <main>
    <div id="reset-form-card" class="reset-card">
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>
      <form id="reset-form" onsubmit="handleReset(event)">
        <input id="new-password" class="reset-input" type="password" placeholder="New password (min 8 characters)" required minlength="8" autocomplete="new-password" />
        <input id="confirm-password" class="reset-input" type="password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password" />
        <button type="submit" class="reset-btn" id="reset-btn">Reset Password</button>
      </form>
      <p id="reset-error" class="reset-error hidden"></p>
      <p id="reset-success" class="reset-success hidden"></p>
      <div class="back-link"><a href="/login">Back to Login</a></div>
    </div>
  </main>

  <script>
    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token') || '';
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('reset-btn');
      const errorEl = document.getElementById('reset-error');
      const successEl = document.getElementById('reset-success');
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (newPass !== confirmPass) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      if (newPass.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: getToken(), new_password: newPass }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.detail || 'Reset failed.';
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
          return;
        }

        successEl.textContent = 'Password reset successfully! Redirecting to login...';
        successEl.classList.remove('hidden');
        document.getElementById('reset-form').classList.add('hidden');
        setTimeout(() => { window.location.href = '/login'; }, 2000);
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
